services:

  opencloud-ocrmyscan:
    # Dockhand writes stack variables to this file. Keep it optional so a
    # missing file does not prevent deployment while Dockhand creates it.
    env_file:
      - path: ./.env
        required: false
    build:
      context: .
      dockerfile: ./watcher/Dockerfile
      args:
        TESSERACT_PACKAGES: ${TESSERACT_PACKAGES:-tesseract-ocr-deu tesseract-ocr-eng}
    container_name: opencloud-ocrmyscan
    restart: unless-stopped

    volumes:
      # Central scan root from the NAS
      - ${SCAN_ROOT_HOST:-/volume1/docker-ssd/opencloud-ocrmyscan/scan}:/opencloud-ocrmypdf/scan

      # temporary processing
      - ${FOLDER_PROCESS:-/volume1/docker-ssd/opencloud-ocrmyscan/process}:/opencloud-ocrmypdf/process

      # Persistent scan-to-WebDAV mappings (mappings.yaml)
      - ${CONFIG_DIR_HOST:-/volume1/docker-ssd/opencloud-ocrmyscan/config}:/opencloud-ocrmypdf/config:ro

    environment:
      TZ: ${TZ:-Europe/Berlin}

      # Watcher settings
      # These internal container paths must match the bind mounts above.
      WATCHER_SCAN_ROOT: /opencloud-ocrmypdf/scan
      WATCHER_TMP_ROOT: /opencloud-ocrmypdf/process
      WATCHER_POLL_INTERVAL_SECONDS: ${WATCHER_POLL_INTERVAL_SECONDS:-10}
      WATCHER_REPROCESS_INTERVAL_MINUTES: ${WATCHER_REPROCESS_INTERVAL_MINUTES:-1440}
      MAPPING_CONFIG_FILE: /opencloud-ocrmypdf/config/mappings.yaml

      # OCR settings
      OCR_LANGUAGES: ${OCR_LANGUAGES:-deu eng}
      OCR_DESKEW: ${OCR_DESKEW:-true}
      OCR_ROTATE_PAGES: ${OCR_ROTATE_PAGES:-true}
      OCR_CLEAN: ${OCR_CLEAN:-true}
      OCR_CLEAN_FINAL: ${OCR_CLEAN_FINAL:-false}
      OCR_REMOVE_BACKGROUND: ${OCR_REMOVE_BACKGROUND:-false}
      OCR_SKIP_TEXT: ${OCR_SKIP_TEXT:-true}
      OCR_REDO_OCR: ${OCR_REDO_OCR:-false}
      OCR_FORCE_OCR: ${OCR_FORCE_OCR:-false}

      # OpenCloud WebDAV
      WEBDAV_USER: ${WEBDAV_USER}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD}
