name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r watcher/requirements.txt
      - run: python -m unittest watcher.test_watcher
      - run: docker build --tag opencloud-ocrmyscan:test --file watcher/Dockerfile .
